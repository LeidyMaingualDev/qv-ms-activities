server:
  port: 8085

spring:
  application:
    name: qv-ms-activities

  datasource:
    url: jdbc:mysql://localhost:3306/activities_service?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: YOUR_DB_PASSWORD
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  cloud:
    consul:
      host: localhost
      port: 8500
      discovery:
        service-name: qv-ms-activities
        health-check-path: /actuator/health
        health-check-interval: 10s
        prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

services:
  events:
    url: http://localhost:8084        # qv-ms-events — para validar membresía
  notifications:
    url: http://localhost:8089        # qv-ms-notifications
